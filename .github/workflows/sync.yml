name: Slack Lists sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Create the Float tasks and Dropbox folders (false = dry run)"
        type: boolean
        default: true

concurrency:
  group: slack-lists-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the sync
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FLOAT_API_TOKEN: ${{ secrets.FLOAT_API_TOKEN }}
          FLOAT_USER_AGENT: ${{ secrets.FLOAT_USER_AGENT }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python sync.py --apply
          else
            python sync.py
          fi
